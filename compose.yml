services:
  reverse-transliteration:
    build: .
    platform: linux/amd64
    init: true
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      WORKERS: 1
      RATE_LIMIT_RPS: 100
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - reverse-cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1
    pids_limit: 32
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  reverse-cache:
